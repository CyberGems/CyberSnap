name: Verify About icon synchronization

on:
  push:
    branches: [main]
    paths:
      - 'scripts/*SuiteIcon*'
      - 'src/CyberSnap/Assets/Suite/**'
      - 'src/CyberSnap/UI/SuiteCatalog.cs'
      - '.github/workflows/release.yml'
      - '.github/workflows/verify-suite-icons.yml'
  pull_request:
    paths:
      - 'scripts/*SuiteIcon*'
      - 'src/CyberSnap/Assets/Suite/**'
      - 'src/CyberSnap/UI/SuiteCatalog.cs'
      - '.github/workflows/release.yml'
      - '.github/workflows/verify-suite-icons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test synchronization and failure handling
        shell: pwsh
        run: ./scripts/Test-SuiteIcons.ps1

      - name: Refresh official About icons
        shell: pwsh
        run: |
          ./scripts/Sync-SuiteIcons.ps1 -Source GitHub -ReportPath "$env:RUNNER_TEMP/about-icons.json"
          '### About icon sources and SHA256' >> $env:GITHUB_STEP_SUMMARY
          '```json' >> $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:RUNNER_TEMP/about-icons.json" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Build with refreshed icons
        run: dotnet build src/CyberSnap/CyberSnap.csproj --configuration Release
