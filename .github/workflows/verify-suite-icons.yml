name: Verify About icon synchronization

on:
  push:
    branches: [main]
    paths:
      - 'scripts/*SuiteIcon*'
      - '.github/about-icons.json'
      - '.github/actions/sync-suite-icons/**'
      - 'src/CyberSnap/Assets/Suite/**'
      - 'src/CyberSnap/UI/SuiteCatalog.cs'
      - '.github/workflows/release.yml'
      - '.github/workflows/verify-suite-icons.yml'
  pull_request:
    paths:
      - 'scripts/*SuiteIcon*'
      - '.github/about-icons.json'
      - '.github/actions/sync-suite-icons/**'
      - 'src/CyberSnap/Assets/Suite/**'
      - 'src/CyberSnap/UI/SuiteCatalog.cs'
      - '.github/workflows/release.yml'
      - '.github/workflows/verify-suite-icons.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test synchronization and failure handling
        shell: pwsh
        run: ./scripts/Test-SuiteIcons.ps1

      - name: Refresh official About icons
        uses: ./.github/actions/sync-suite-icons
        with:
          config: .github/about-icons.json

      - name: Build with refreshed icons
        run: dotnet build src/CyberSnap/CyberSnap.csproj --configuration Release
