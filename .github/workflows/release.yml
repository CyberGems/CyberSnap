name: Build and Release CyberSnap

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release summary
        run: node .github/scripts/validate-release-summary.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore CyberSnap.sln

      - name: Validate Localization
        shell: pwsh
        run: ./scripts/Test-Localization.ps1 -Strict

      - name: Validate CyberSnap Share Branding
        shell: pwsh
        run: ./scripts/Test-CyberSnapShareBrand.ps1

      - name: Test About icon synchronization
        shell: pwsh
        run: ./scripts/Test-SuiteIcons.ps1

      - name: Refresh About icons from official app repositories
        shell: pwsh
        run: |
          ./scripts/Sync-SuiteIcons.ps1 -Source GitHub -ReportPath "$env:RUNNER_TEMP/about-icons.json"
          '### About icon sources and SHA256' >> $env:GITHUB_STEP_SUMMARY
          '```json' >> $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:RUNNER_TEMP/about-icons.json" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Build Solution
        run: dotnet build CyberSnap.sln --configuration Release --no-restore

      - name: Publish Win-x64 Self-Contained Exe
        run: |
          dotnet publish src/CyberSnap/CyberSnap.csproj -c Release -r win-x64 --self-contained true -p:SelfContained=true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o ./publish-win64

      - name: Verify the publish embeds the .NET runtime
        shell: pwsh
        run: ./scripts/Test-SelfContainedBundle.ps1 -Exe ./publish-win64/CyberSnap.exe

      - name: Bundle FFmpeg
        shell: pwsh
        run: ./scripts/Get-BundledFfmpeg.ps1 -Destination ./publish-win64

      - name: Zip Published Output
        shell: powershell
        run: |
          Compress-Archive -Path ./publish-win64/* -DestinationPath ./CyberSnap-${{ github.ref_name }}-Portable-win-x64.zip

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          ./scripts/Build-Installer.ps1 -AppVersion "${{ github.ref_name }}"

      - name: Prepare Release Notes & Scan with VirusTotal
        id: virustotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $installerPath = "./CyberSnap-Setup-${{ github.ref_name }}.exe"
          $portablePath = "./CyberSnap-${{ github.ref_name }}-Portable-win-x64.zip"

          $installerHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $portablePath -Algorithm SHA256).Hash.ToLower()

          Write-Host "Installer SHA256: $installerHash"
          Write-Host "Portable SHA256: $portableHash"

          if ($env:VIRUSTOTAL_API_KEY) {
            function Upload-VirusTotal($filePath, $apiKey) {
              $item = Get-Item $filePath
              $sizeMb = [Math]::Round($item.Length / 1MB, 2)
              Write-Host "Uploading $filePath ($sizeMb MB) to VirusTotal..."
              $headers = @{ "x-apikey" = $apiKey }
              $url = "https://www.virustotal.com/api/v3/files"

              if ($item.Length -gt 30MB) {
                Write-Host "File exceeds 30MB ($sizeMb MB), requesting dedicated large-file upload endpoint from VirusTotal..."
                $urlResp = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Method Get -Headers $headers -TimeoutSec 60
                $url = $urlResp.data
                Write-Host "Using dedicated endpoint: $url"
              }

              $resp = & curl.exe -s -S --fail -X POST -H "x-apikey: $apiKey" -F "file=@$filePath" "$url"
              Write-Host "Upload successful. Response: $resp"
            }

            try {
              Upload-VirusTotal $installerPath $env:VIRUSTOTAL_API_KEY
            } catch {
              Write-Warning "VirusTotal installer upload warning: $_"
            }

            try {
              Upload-VirusTotal $portablePath $env:VIRUSTOTAL_API_KEY
            } catch {
              Write-Warning "VirusTotal portable upload warning: $_"
            }
          } else {
            Write-Host "VIRUSTOTAL_API_KEY secret not found; skipping direct upload and using computed SHA256 hashes for reports."
          }

          $template = [System.IO.File]::ReadAllText(".github/release-template.md", [System.Text.Encoding]::UTF8)
          $notes = $template.Replace("{{VERSION}}", "${{ github.ref_name }}").Replace("{{INSTALLER_HASH}}", $installerHash).Replace("{{PORTABLE_HASH}}", $portableHash)
          [System.IO.File]::WriteAllText("release_notes.md", $notes, [System.Text.Encoding]::UTF8)

          $tag = "${{ github.ref_name }}"
          # winget versions carry no 'v' prefix (1.18.0, not v1.18.0); URLs keep it.
          $bareVersion = if ($tag.StartsWith("v")) { $tag.Substring(1) } else { $tag }
          $manifestFiles = @{
              "winget-version.yaml"   = "CyberGems.CyberSnap.yaml"
              "winget-locale.yaml"    = "CyberGems.CyberSnap.locale.en-US.yaml"
              "winget-installer.yaml" = "CyberGems.CyberSnap.installer.yaml"
          }
          New-Item -ItemType Directory -Path winget-pkg -Force | Out-Null
          foreach ($entry in $manifestFiles.GetEnumerator()) {
              $manifestTemplate = [System.IO.File]::ReadAllText($entry.Key, [System.Text.Encoding]::UTF8)
              $manifest = $manifestTemplate.Replace("{{VERSION}}", $bareVersion).Replace("{{TAG}}", $tag).Replace("{{INSTALLER_HASH}}", $installerHash)
              [System.IO.File]::WriteAllText("winget-pkg/$($entry.Value)", $manifest, [System.Text.Encoding]::UTF8)
          }
          Write-Host "Generated winget manifests for $tag with hash: $installerHash"

      - name: Validate winget manifests
        shell: pwsh
        run: |
          winget validate winget-pkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: "CyberSnap ${{ github.ref_name }}"
          files: |
            ./CyberSnap-${{ github.ref_name }}-Portable-win-x64.zip
            ./CyberSnap-Setup-${{ github.ref_name }}.exe
            ./winget-pkg/CyberGems.CyberSnap.yaml
            ./winget-pkg/CyberGems.CyberSnap.locale.en-US.yaml
            ./winget-pkg/CyberGems.CyberSnap.installer.yaml
          draft: true
          prerelease: false
          body_path: ./release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
