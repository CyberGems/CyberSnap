# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: CyberGems.CyberSnap
PackageVersion: {{VERSION}}
InstallerType: inno
Scope: machine
InstallModes:
- interactive
- silent
- silentWithProgress
InstallerSwitches:
  Silent: /VERYSILENT /NORESTART /SUPPRESSMSGBOXES
  SilentWithProgress: /VERYSILENT /NORESTART /SUPPRESSMSGBOXES
  Custom: /NORESTART /SUPPRESSMSGBOXES
Commands:
- cybersnap
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/CyberGems/CyberSnap/releases/download/{{TAG}}/CyberSnap-Setup-{{TAG}}.exe
  InstallerSha256: {{INSTALLER_HASH}}
ManifestType: installer
ManifestVersion: 1.6.0
