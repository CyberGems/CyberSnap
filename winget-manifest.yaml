Installers:
- Architecture: x64
  InstallerType: inno
  InstallerUrl: https://github.com/CyberGems/CyberSnap/releases/download/{{VERSION}}/CyberSnap-Setup-{{VERSION}}.exe
  InstallerSha256: {{INSTALLER_HASH}}
  Scope: machine
  InstallModes:
  - interactive
  - silent
  - silentWithProgress
  Switches:
    Silent: /VERYSILENT /NORESTART /SUPPRESSMSGBOXES
    SilentWithProgress: /VERYSILENT /NORESTART /SUPPRESSMSGBOXES
    Custom: /NORESTART /SUPPRESSMSGBOXES
  ExpectedReturnCodes:
  - InstallerReturnCode: 0
    ReturnResponse: success
  - InstallerReturnCode: 1605
    ReturnResponse: notInstalled
  - InstallerReturnCode: 1641
    ReturnResponse: rebootRequired
  - InstallerReturnCode: 3010
    ReturnResponse: rebootRequired
